name: Unity license test

on: workflow_dispatch

jobs:
  build:
    name: Activate and build a test APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the Unity image
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: game-ci/cli@v0.1.61
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          args: build . --target-platform Android --build-method CiBuild.Android --build-name unity-test --allow-dirty-build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-apk
          path: build

name: Unity license test

# Run by hand from the Actions tab, after the two secrets are added.
on: workflow_dispatch

jobs:
  activate:
    name: 1. Activate Unity with account only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: game-ci/unity-activate@v3.0.0-beta.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.61

  build:
    name: 2. Build a test APK
    needs: activate
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the Unity image
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: CiBuild.Android
          buildName: unity-test
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        with:
          name: unity-test-apk
          path: build
